name: guards

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: secrets and local paths
        run: bash lab/check-secrets.sh
      - name: relative links resolve
        run: python3 lab/check-links.py
      - name: claim registry
        run: python3 lab/check-claims.py --strict
      - name: attack suites and refusal coverage
        run: |
          python3 lab/e-m36-run.py
          python3 lab/e-m42-run.py
          python3 lab/check-refusal-coverage.py
      - name: published schemas accept the artifacts
        run: |
          python3 tools/fg_schema_check.py --claim fixtures/attack/k-proven.json
          python3 tools/fg_schema_check.py --inventory tools/_tmp/m13.json || true
      - name: metric digests resolve
        run: python3 lab/check-metric-digests.py --cards
      - name: backticked paths resolve
        run: python3 lab/check-artifact-refs.py
      - name: every document is linked from the README
        run: python3 lab/check-readme.py
      - name: negative controls for every guard
        run: bash lab/selftest-guards.sh
