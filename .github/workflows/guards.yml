name: guards

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: secrets and local paths
        run: bash lab/check-secrets.sh
      - name: relative links resolve
        run: python3 lab/check-links.py
      - name: claim registry
        run: python3 lab/check-claims.py
