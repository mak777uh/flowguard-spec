name: guards

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # base_commit resolution needs history, and it belongs to checkout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: secrets and local paths
        run: bash lab/check-secrets.sh
      - name: relative links resolve
        run: python3 lab/check-links.py
      - name: claim registry
        run: python3 lab/check-claims.py --strict
      - name: attack suites and refusal coverage
        run: |
          python3 lab/e-m36-run.py
          python3 lab/e-m42-run.py
          python3 lab/check-refusal-coverage.py
      - name: no two documents share a number
        run: python3 lab/check-doc-numbers.py
      - name: new experiment cards are pre-registered
        run: python3 lab/check-preregistration.py
      - name: the elimination registry matches the cards
        run: python3 lab/check-eliminations.py
      - name: no CRLF, every shell script parses
        run: python3 lab/check-line-endings.py
      - name: published schemas accept the artifacts
        run: |
          python3 tools/fg_schema_check.py --claim fixtures/attack/k-proven.json
          # The refusal is the assertion: a malformed inventory must make the checker exit 1, and a step
          # that cannot fail is not a check (external audit, 2026-10-29). tools/_tmp is gitignored, so the
          # fixture comes from fixtures/ and the expected code is asserted rather than waved through.
          python3 tools/fg_schema_check.py --inventory fixtures/attack/a6-inv.json
          # and one that must be refused: a step whose success does not depend on the checker's verdict
          # is not a check (external audit, 2026-10-29).
          set +e
          python3 tools/fg_schema_check.py --inventory fixtures/schema-check/invalid-inventory.json
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "the schema check accepted an inventory with paths as a string"; exit 1; fi
      - name: metric digests resolve
        run: python3 lab/check-metric-digests.py --cards
      - name: backticked paths resolve
        run: python3 lab/check-artifact-refs.py
      - name: the Russian mirror never contradicts the canon on numbers
        run: python3 lab/check-readme-parity.py
      - name: every document is linked from the README
        run: python3 lab/check-readme.py
      - name: the published method kit matches the tree
        # docs/STATUS-v0.md prints the kit conformance; a number without a step that recomputes it is a
        # number without a carrier (external audit, 2026-10-29).
        run: python3 lab/check-interop.py --repo .
      - name: every card and note is indexed
        run: |
          python3 lab/build-indexes.py --check
          python3 lab/check-evidence-reachability.py
          python3 lab/check-runner-coverage.py
      - name: STATUS is regenerated, not edited
        # docs/STATUS-v0.md states that "the build fails when it is stale". Until this step existed, the
        # build did not fail: a hand-edited or stale STATUS passed CI (QA preflight, 2026-10-31).
        run: python3 tools/fg_status.py --check

      - name: negative controls for every guard
        run: bash lab/selftest-guards.sh
